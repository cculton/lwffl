<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LWFFL — Legion of Whom Fantasy Football League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=5">
  <script defer src="assets/nav.js?v=1"></script>
</head>
<body>

<nav class="topnav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span>LW</span>FFL</a>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="notebook.html">Notebook</a>
      <a href="managers.html">Managers</a>
      <a href="seasons.html">Seasons</a>
      <a href="boxscores.html">Scores</a>
      <a href="transactions.html">Transactions</a>
      <a href="h2h.html">H2H</a>
      <a href="draft.html">Draft</a>
      <a href="explorer.html">Stat Lab</a>
      <a href="records.html">Records</a>
      <a href="arcade.html">Arcade</a>
      <a href="league.html">Constitution</a>
    </div>
  </div>
</nav>

<div class="wrap">

  <header class="hero">
    <h1><span style="color:var(--accent)">Legion of Whom</span><br>Fantasy Football League</h1>
  </header>

  <section class="home-notebook" aria-labelledby="latestNotebookHeading">
    <h2 class="section-label" id="latestNotebookHeading">Latest from the Notebook</h2>
    <div id="latestNotebookCard" class="loading">Loading latest post…</div>
  </section>

  <div id="main" class="loading">Loading league history…</div>

</div>

<footer class="footer">
  LWFFL · Legion of Whom Fantasy Football League
</footer>

<script src="assets/data.js?v=2"></script>
<script src="assets/tables.js?v=2"></script>
<script>
fetch("notebook-index.json")
  .then(response => {
    if (!response.ok) throw new Error("Could not load Notebook index");
    return response.json();
  })
  .then(index => {
    const posts = index.posts || [];
    const post = posts.find(p => !p.sample) || posts[0];
    const card = document.getElementById("latestNotebookCard");
    if (!post) {
      document.querySelector(".home-notebook").hidden = true;
      return;
    }
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    const edition = { announcement: "Announcement", preview: "Preview", sunday: "Sunday Update", recap: "Recap" };
    const date = new Date(`${post.date}T12:00:00`).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    const image = post.image
      ? (/^https?:\/\//.test(post.image) ? post.image : post.image.replace(/^\/+/, ""))
      : `n/cards/${post.slug}.png`;
    card.classList.remove("loading");
    card.innerHTML = `
      <a class="card home-notebook-card" href="n/${encodeURIComponent(post.slug)}.html">
        <div class="home-notebook-copy">
          <div class="nb-kicker">
            <span class="nb-ed">${esc(edition[post.edition] || "Notebook")}</span>
            ${post.week ? `<span class="nb-wk">Week ${esc(post.week)}</span>` : ""}
            <span class="nb-date">${esc(date)}</span>
          </div>
          <div class="nb-title">${esc(post.title)}</div>
          <div class="nb-dek">${esc(post.dek)}</div>
          <span class="home-notebook-link">Read the post →</span>
        </div>
        <div class="home-notebook-thumb">
          <img src="${esc(image)}" alt="" loading="lazy" />
          <span class="home-notebook-thumb-fallback" aria-hidden="true">LWFFL Notebook</span>
        </div>
      </a>`;
    card.querySelector("img").addEventListener("error", event => {
      event.target.parentElement.classList.add("is-fallback");
    });
  })
  .catch(error => {
    console.error(error);
    document.getElementById("latestNotebookCard").innerHTML =
      '<a class="card" href="notebook.html">Read the Notebook →</a>';
  });

LWFFL.load().then(M => {
  const { fmt, fmtInt, mlink, ylink, bxlink, recordStr, shortName, managerLabel, managerCell, finishCell } = LWFFL;
  const latest = M.seasonSummaries[M.seasonSummaries.length - 1];
  const totalPoints = M.games.reduce((a, g) => a + g.score1 + g.score2, 0);

  const careers = Object.values(M.managers)
    .map(m => ({ name: m.name, slug: m.slug, ...m.career }))
    .sort((a, b) =>
      b.titles.length - a.titles.length ||
      b.winPct - a.winPct
    );

  const podium = careers.filter(c => c.titles.length > 0).slice(0, 3);
  const medals = ["🥇", "🥈", "🥉"];

  document.getElementById("main").classList.remove("loading");
  document.getElementById("main").innerHTML = `

    <div class="section-label">League at a Glance</div>
    <div class="champ-banner" style="margin-bottom:14px">
      <div class="trophy">🏆</div>
      <div style="flex:1;min-width:200px">
        <div class="cb-label">Defending Champion · ${latest.year}</div>
        <div class="cb-name">${mlink(latest.champ.manager)}</div>
        <div class="cb-meta">
          Defeated ${mlink(latest.runnerUp.manager)}
          ${latest.champScore ? bxlink(latest.year, latest.champGame.week, latest.champ.manager,
              `${fmt(latest.champScore.winner)} – ${fmt(latest.champScore.loser)}`) : ""}
          in the championship · regular season ${recordStr(latest.champ.wins, latest.champ.losses, latest.champ.ties)}
        </div>
      </div>
      <a class="pill accent" href="seasons.html?y=${latest.year}" style="text-decoration:none">Full season →</a>
    </div>

    <div class="grid grid-4">
      <div class="card">
        <div class="stat-label">Seasons</div>
        <div class="stat-value">${M.years.length}</div>
        <div class="stat-sub">${M.years[0]}–${M.years[M.years.length - 1]}</div>
      </div>
      <div class="card">
        <div class="stat-label">Matchups Played</div>
        <div class="stat-value">${fmtInt(M.games.length)}</div>
        <div class="stat-sub">regular season + playoffs</div>
      </div>
      <div class="card">
        <div class="stat-label">Points Scored</div>
        <div class="stat-value">${fmtInt(totalPoints)}</div>
        <div class="stat-sub">all-time, both sides</div>
      </div>
      <div class="card">
        <div class="stat-label">Managers</div>
        <div class="stat-value">${careers.length}</div>
        <div class="stat-sub">${careers.filter(c => c.active).length} active</div>
      </div>
    </div>

    <div class="section-label">Title Podium</div>
    <div class="grid grid-3">
      ${podium.map((c, i) => `
        <a class="card" href="managers.html?m=${c.slug}">
          <div style="display:flex;align-items:center;gap:14px">
            <div style="font-size:2rem">${medals[i]}</div>
            <div>
              <div style="font-family:var(--font-display);font-weight:700;font-size:1.15rem">${managerLabel(c.name)}</div>
              <div class="stat-sub">${c.titles.length} title${c.titles.length > 1 ? "s" : ""} · ${c.titles.join(", ")}</div>
            </div>
          </div>
        </a>`).join("")}
    </div>

    <div class="section-label">All-Time Standings <span style="font-weight:400;text-transform:none;letter-spacing:0">— records include playoffs · click any column to sort</span></div>
    <div id="allTimeTbl"></div>

    <div class="section-label">Recent Champions</div>
    <div class="grid grid-auto">
      ${M.seasonSummaries.slice(-4).reverse().map(s => `
        <a class="card" href="seasons.html?y=${s.year}">
          <div class="stat-label">${s.year}</div>
          <div style="font-family:var(--font-display);font-weight:700;font-size:1.15rem;margin-top:6px">🏆 ${managerLabel(s.champ.manager)}</div>
          <div class="stat-sub">over ${managerLabel(s.runnerUp.manager)}${s.champScore ? ` · ${fmt(s.champScore.winner)}–${fmt(s.champScore.loser)}` : ""}</div>
        </a>`).join("")}
    </div>
  `;

  dataTable(document.getElementById("allTimeTbl"), {
    columns: [
      { key: "_rank", label: "#", get: () => null, render: (r, rank) => `<span style="color:var(--soft);font-weight:600">${rank}</span>` },
      { key: "name", label: "Manager", dir: "asc",
        render: c => managerCell(c.name) },
      { key: "seasons", label: "Seasons", num: true },
      { key: "wins", label: "W", num: true },
      { key: "losses", label: "L", num: true },
      { key: "winPct", label: "Win %", num: true, render: c => (c.winPct * 100).toFixed(1) + "%" },
      { key: "pf", label: "PF", num: true, render: c => fmtInt(c.pf) },
      { key: "pa", label: "PA", num: true, render: c => fmtInt(c.pa) },
      { key: "_ppg", label: "PPM", num: true, get: c => c.games ? c.pf / c.games : 0,
        render: c => c.games ? (c.pf / c.games).toFixed(1) : "—" },
      { key: "_titles", label: "Titles", num: true, get: c => c.titles.length,
        render: c => c.titles.length ? "🏆".repeat(c.titles.length) : "—" },
      { key: "_sct", label: "Scoring", num: true, get: c => c.scoringTitles.length,
        render: c => c.scoringTitles.length || "—" },
      { key: "playoffApps", label: "PO Apps", num: true },
      { key: "bestFinish", label: "Best Fin", num: true, dir: "asc",
        render: c => finishCell(c.bestFinish) }
    ],
    rows: careers,
    initialSort: { key: "_titles", dir: "desc" }
  });
}).catch(err => {
  console.error(err);
  document.getElementById("main").textContent = "Could not load league data.";
});
</script>
</body>
</html>
